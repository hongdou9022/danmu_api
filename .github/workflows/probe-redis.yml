name: probe-redis

on:
  workflow_dispatch:
  push:
    branches: [probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        shell: bash
        run: |
          B=https://danmu-api-zeta-brown.vercel.app
          echo "=== 1 no token (expect 401) ==="
          curl -s -o /dev/null -w 'HTTP %{http_code}\n' --max-time 30 "$B/api/v2/search/anime?keyword=test"
          echo "=== 2 hongdou search (expect 200) ==="
          curl -s -o body.json -w 'HTTP %{http_code} time=%{time_total}s\n' --max-time 90 \
            "$B/hongdou/api/v2/search/anime?keyword=%E8%BF%9B%E5%87%BB%E7%9A%84%E5%B7%A8%E4%BA%BA"
          head -c 300 body.json
          echo
          echo "=== 3 repeat same search (should be faster / cache hit) ==="
          curl -s -o /dev/null -w 'HTTP %{http_code} time=%{time_total}s\n' --max-time 60 \
            "$B/hongdou/api/v2/search/anime?keyword=%E8%BF%9B%E5%87%BB%E7%9A%84%E5%B7%A8%E4%BA%BA"

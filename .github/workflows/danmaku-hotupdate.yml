name: Android danmaku engine

on:
  workflow_call:
    inputs:
      candidate_ref:
        description: Ref to build as a candidate after an upstream sync
        required: true
        type: string
  push:
    branches: [main]
    tags: ['android-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a signed, immutable engine release and update the stable manifest
        required: true
        type: boolean
        default: false
      script_version:
        description: Required when publishing manually, for example 20261103.1
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Set candidate version
        id: candidate
        shell: bash
        run: echo "value=dev.$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build Android engine
        run: npm run build-android-danmaku
        env:
          DANMAKU_SCRIPT_VERSION: ${{ steps.candidate.outputs.value }}
          DANMAKU_MIN_APP_VERSION: 1.0.20261103_0000
      - name: Verify Android engine and strict resolver
        run: npm run test-android-danmaku
      - uses: actions/upload-artifact@v4
        with:
          name: android-danmaku-engine-${{ github.sha }}
          path: dist/android/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Set release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.script_version }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == android-* ]]; then
            version="${REF_NAME#android-}"
          else
            version="$INPUT_VERSION"
          fi
          if [[ ! "$version" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "A valid script_version is required for manual publishing." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build and sign engine manifest
        run: npm run build-android-danmaku
        env:
          DANMAKU_SCRIPT_VERSION: ${{ steps.version.outputs.value }}
          DANMAKU_MIN_APP_VERSION: 1.0.20261103_0000
          DANMAKU_SIGNING_PRIVATE_KEY: ${{ secrets.DANMAKU_SIGNING_PRIVATE_KEY }}
      - name: Publish immutable version and stable manifest
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          release_tag="android-${SCRIPT_VERSION}"
          target_commit="$(git rev-parse HEAD)"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; versions are immutable." >&2
            exit 1
          fi
          if tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" 2>/dev/null)"; then
            tag_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
            tag_type="$(jq -r '.object.type' <<<"$tag_ref")"
            if [[ "$tag_type" == "tag" ]]; then
              tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')"
            fi
            if [[ "$tag_sha" != "$target_commit" ]]; then
              echo "Existing tag $release_tag points to a different commit." >&2
              exit 1
            fi
          fi
          test -s dist/android/manifest.sig
          gh release create "$release_tag" \
            dist/android/engine.js dist/android/manifest.json dist/android/manifest.sig \
            --title "Android danmaku engine ${SCRIPT_VERSION}" \
            --notes "Signed Android local danmaku engine. This release is immutable." \
            --target "$target_commit" \
            --latest=false
          if ! gh release view android-stable >/dev/null 2>&1; then
            gh release create android-stable --title "Android danmaku stable manifest" \
              --notes "Mutable pointer to the current compatible Android danmaku engine." \
              --latest=false
          fi
          gh release upload android-stable dist/android/manifest.json dist/android/manifest.sig --clobber

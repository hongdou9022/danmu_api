name: probe-compare

on:
  workflow_dispatch:
  push:
    branches: [probe]

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: compare both endpoints
        shell: bash
        run: |
          V="https://danmu-api-zeta-brown.vercel.app/hongdou/api/v2/search/anime?keyword=%E5%AB%81%E9%87%91%E9%92%97"
          C="https://danmuse7ez.qzz.io/hongdou/api/v2/search/anime?keyword=%E5%AB%81%E9%87%91%E9%92%97"

          echo "===== VERCEL ====="
          curl -s --max-time 90 -o v.json -w 'HTTP %{http_code} time=%{time_total}s\n' "$V"
          echo "count: $(grep -o '"animeId"' v.json | wc -l)"
          grep -o '"animeTitle":"[^"]*"' v.json

          echo
          echo "===== CLOUDFLARE ====="
          curl -s --max-time 90 -o c.json -w 'HTTP %{http_code} time=%{time_total}s\n' "$C"
          echo "count: $(grep -o '"animeId"' c.json | wc -l)"
          grep -o '"animeTitle":"[^"]*"' c.json

          echo
          echo "===== ADMIN_TOKEN 校验 ====="
          echo -n "wrong token -> "
          curl -s -o /dev/null -w 'HTTP %{http_code}\n' --max-time 30 "https://danmuse7ez.qzz.io/87654321/api/logs"
          echo -n "admin token -> "
          curl -s -o /dev/null -w 'HTTP %{http_code}\n' --max-time 30 "https://danmuse7ez.qzz.io/cloud/api/logs"

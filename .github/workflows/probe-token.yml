name: probe-token
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          B=https://danmu-api-zeta-brown.vercel.app
          echo "1-no-token:"; curl -s -o /dev/null -w "  HTTP %{http_code}
" --max-time 30 "$B/api/v2/search/anime?keyword=test"
          echo "2-default-87654321:"; curl -s -o /dev/null -w "  HTTP %{http_code}
" --max-time 30 "$B/87654321/api/v2/search/anime?keyword=test"
          echo "3-hongdou:"; curl -s -o body.json -w "  HTTP %{http_code}
" --max-time 60 "$B/hongdou/api/v2/search/anime?keyword=test"
          echo "4-body:"; head -c 300 body.json; echo
